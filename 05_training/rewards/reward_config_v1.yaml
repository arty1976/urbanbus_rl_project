artifact_version: mappo_reward_v1

weights:
  service_rate_weight: 3.0
  avg_wait_weight: 2.0
  long_wait_weight: 3.0
  on_time_weight: 1.0
  bunching_weight: 1.5
  energy_per_passenger_weight: 1.0
  fleet_reduction_weight: 0.5
  constraint_violation_weight: 10.0

constraints:
  min_service_rate: 0.95
  max_avg_wait_ratio_vs_baseline: 1.10
  max_p95_wait_ratio_vs_baseline: 1.15
  qwen_trigger_rate_required_for_A: 0.0

baselines:
  avg_wait_seconds: 300.0
  passenger_wait_p95_seconds: 600.0
  energy_proxy_per_passenger: 10.0

notes:
  objective_order:
    - passenger service quality first
    - average wait control
    - long-wait tail risk control
    - on-time and bunching stability
    - energy and fleet efficiency second
  energy_rule: "Do not optimize raw energy_proxy alone. Use energy_proxy_per_passenger."
  fleet_rule: "fleet_reduction_ratio is a bonus, not a hard objective."
  qwen_rule: "A_pure_mappo must have qwen_trigger_rate == 0.0."
